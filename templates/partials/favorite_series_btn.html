<button 
  type="button" 
  id="fav-series-btn-{{ series_id }}"
  hx-post="/series/{{ series_id }}/favorite?context={{ context|default('inline') }}" 
  hx-target="this" 
  hx-swap="outerHTML"
  onclick="event.stopPropagation();"
  title="{% if is_favorite %}Unfavorite Series{% else %}Add Series to Favorites{% endif %}"
  class="inline-flex items-center justify-center transition-all cursor-pointer {% if context == 'pill' %}px-2.5 py-1 rounded-xl text-xs font-semibold gap-1.5 {% if is_favorite %}bg-rose-600 hover:bg-rose-500 text-white shadow-md shadow-rose-600/30{% else %}bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700/80{% endif %}{% elif context == 'modal' %}p-1 rounded-lg text-xs {% if is_favorite %}text-rose-400 hover:text-rose-300{% else %}text-slate-500 hover:text-rose-400{% endif %}{% else %}w-6 h-6 rounded-lg {% if is_favorite %}bg-rose-600/30 text-rose-400 border border-rose-500/40{% else %}bg-slate-800/80 text-slate-400 hover:text-rose-400 border border-slate-700/80 hover:border-rose-500/40{% endif %}{% endif %}"
>
  <svg class="w-3.5 h-3.5 {% if is_favorite %}fill-current text-rose-400{% else %}fill-none stroke-current{% endif %}" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
  </svg>
  {% if context == 'pill' %}
  <span>{% if is_favorite %}Favorited Series{% else %}Favorite Series{% endif %}</span>
  {% endif %}
</button>
