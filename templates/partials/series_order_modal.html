<div id="series-order-modal" class="fixed inset-0 z-[60] overflow-y-auto flex items-center justify-center p-3 sm:p-6 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
  <!-- Backdrop Click Area -->
  <div class="fixed inset-0" onclick="closeSeriesOrderModal()"></div>

  <!-- Modal Dialog Card -->
  <div class="relative bg-slate-900 border border-slate-700/80 rounded-2xl shadow-2xl max-w-3xl w-full overflow-hidden z-10 p-4 sm:p-6 space-y-4 max-h-[92vh] flex flex-col">
    
    <!-- Header -->
    <div class="flex items-center justify-between pb-3 border-b border-slate-800 flex-shrink-0">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 rounded-xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" /></svg>
        </div>
        <div class="min-w-0">
          <h2 class="text-base sm:text-lg font-bold text-white truncate">Series Reading Order</h2>
          <p class="text-xs text-slate-400 truncate">
            <span class="text-indigo-400 font-semibold">{{ series.name }}</span> &bull; {{ books|length }} books
          </p>
        </div>
      </div>
      <button 
        type="button" 
        onclick="closeSeriesOrderModal()" 
        class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition-colors border border-slate-700 cursor-pointer flex-shrink-0"
        title="Close (Esc)"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <!-- Quick Utilities & Actions Bar -->
    <div class="flex flex-wrap items-center justify-between gap-2 p-2.5 bg-slate-950/60 rounded-xl border border-slate-800 text-xs flex-shrink-0">
      <div class="flex flex-wrap items-center gap-1.5">
        <button 
          type="button" 
          onclick="seriesAutoRenumber()" 
          class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg font-semibold bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 hover:text-white border border-indigo-500/30 transition-all cursor-pointer"
          title="Assign sequential volume numbers 1, 2, 3... down the current list"
        >
          <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
          <span>Auto-Number 1..N</span>
        </button>

        <button 
          type="button" 
          onclick="seriesSortByTitle()" 
          class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg font-medium bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 transition-all cursor-pointer"
          title="Sort list alphabetically by title"
        >
          <span>A-Z</span>
        </button>

        <button 
          type="button" 
          onclick="seriesSortByDate()" 
          class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg font-medium bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 transition-all cursor-pointer"
          title="Sort list by release date"
        >
          <span>Release Date</span>
        </button>
      </div>

      <div class="flex items-center gap-2">
        <span id="series-order-status" class="text-xs text-emerald-400 font-medium hidden flex items-center gap-1">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
          <span>Saved!</span>
        </span>
        <button 
          type="button" 
          id="series-order-save-btn"
          onclick="saveSeriesOrder({{ series.id }})" 
          class="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-xl font-bold text-white bg-indigo-600 hover:bg-indigo-500 shadow-md shadow-indigo-600/30 transition-all cursor-pointer"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>
          <span>Save Order</span>
        </button>
      </div>
    </div>

    <!-- Instruction hint -->
    <div class="text-[11px] text-slate-400 flex items-center justify-between px-1 flex-shrink-0">
      <span>Drag rows or use <b>▲ ▼</b> to arrange books, or type volume numbers directly.</span>
      <span class="text-slate-500">Decimals like 1.5 are supported</span>
    </div>

    <!-- Books List Container (Scrollable) -->
    <div id="series-books-list" class="space-y-1.5 overflow-y-auto pr-1 flex-1 min-h-[250px]">
      {% for b in books %}
      <div 
        id="series-row-{{ b.id }}"
        data-book-id="{{ b.id }}"
        data-title="{{ b.title|lower }}"
        data-date="{{ b.pubdate or '9999-99-99' }}"
        draggable="true"
        ondragstart="onSeriesDragStart(event)"
        ondragover="onSeriesDragOver(event)"
        ondrop="onSeriesDrop(event)"
        class="series-item flex items-center justify-between gap-2.5 p-2 rounded-xl bg-slate-950/60 hover:bg-slate-800/60 border border-slate-800/80 hover:border-indigo-500/30 transition-colors group"
      >
        <!-- Drag Handle & Up/Down Arrows -->
        <div class="flex items-center gap-1 flex-shrink-0">
          <div class="cursor-grab active:cursor-grabbing text-slate-500 hover:text-slate-300 px-1 py-1" title="Drag to reorder">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16" /></svg>
          </div>
          <div class="flex flex-col">
            <button 
              type="button" 
              onclick="moveSeriesRow({{ b.id }}, -1)" 
              class="text-slate-500 hover:text-indigo-400 p-0.5 leading-none transition-colors"
              title="Move Up"
            >
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7" /></svg>
            </button>
            <button 
              type="button" 
              onclick="moveSeriesRow({{ b.id }}, 1)" 
              class="text-slate-500 hover:text-indigo-400 p-0.5 leading-none transition-colors"
              title="Move Down"
            >
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" /></svg>
            </button>
          </div>
        </div>

        <!-- Volume Number Input -->
        <div class="flex items-center gap-1.5 flex-shrink-0">
          <span class="text-xs font-bold text-slate-500 font-mono">#</span>
          <input 
            type="number" 
            step="any" 
            min="0"
            id="series-idx-input-{{ b.id }}"
            value="{{ b.series_index_val }}" 
            placeholder="—"
            class="series-idx-input w-16 px-2 py-1 text-center font-mono font-bold text-xs bg-slate-900 border border-slate-700 rounded-lg text-indigo-300 focus:border-indigo-500 focus:bg-slate-950 focus:outline-none transition-all shadow-inner"
            title="Volume number in series"
          />
        </div>

        <!-- Book Cover -->
        <div class="w-8 h-11 rounded overflow-hidden bg-slate-900 border border-slate-800 flex-shrink-0 shadow">
          <img 
            src="{{ b.thumbnail_url }}" 
            alt="{{ b.title }}" 
            class="w-full h-full object-cover"
            onerror="this.onerror=null; this.src='/static/placeholder.svg';"
          />
        </div>

        <!-- Book Title & Author -->
        <div class="min-w-0 flex-1">
          <h4 class="text-xs font-semibold text-white truncate" title="{{ b.title }}">{{ b.title }}</h4>
          <p class="text-[10px] text-slate-400 truncate flex items-center gap-2 mt-0.5">
            <span>{{ b.author }}</span>
            {% if b.pubdate %}
            <span>&bull;</span>
            <span class="text-slate-500 font-mono">{{ b.pubdate }}</span>
            {% endif %}
          </p>
        </div>

        <!-- Quick actions -->
        <div class="flex items-center gap-1 flex-shrink-0">
          <button 
            type="button" 
            onclick="moveSeriesRowToEdge({{ b.id }}, 'top')" 
            class="text-[10px] px-1.5 py-0.5 rounded text-slate-500 hover:text-slate-200 hover:bg-slate-800 transition-colors"
            title="Move to Top"
          >
            Top
          </button>
          <button 
            type="button" 
            onclick="moveSeriesRowToEdge({{ b.id }}, 'bottom')" 
            class="text-[10px] px-1.5 py-0.5 rounded text-slate-500 hover:text-slate-200 hover:bg-slate-800 transition-colors"
            title="Move to Bottom"
          >
            Btm
          </button>
        </div>
      </div>
      {% endfor %}
    </div>

    <!-- Modal Footer -->
    <div class="pt-3 border-t border-slate-800 flex items-center justify-between text-xs flex-shrink-0">
      <button 
        type="button" 
        onclick="closeSeriesOrderModal()" 
        class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-300 bg-slate-800 hover:bg-slate-700 transition-colors cursor-pointer"
      >
        Cancel
      </button>

      <button 
        type="button" 
        onclick="saveSeriesOrder({{ series.id }})" 
        class="px-5 py-2 rounded-xl text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-500 shadow-lg shadow-indigo-600/30 transition-all cursor-pointer flex items-center gap-1.5"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
        <span>Save Changes</span>
      </button>
    </div>

  </div>

  <script>
    let draggedRow = null;

    function onSeriesDragStart(e) {
      draggedRow = e.currentTarget;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/html', draggedRow.outerHTML);
      draggedRow.classList.add('opacity-40');
    }

    function onSeriesDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const target = e.currentTarget;
      if (target && target !== draggedRow && target.classList.contains('series-item')) {
        const rect = target.getBoundingClientRect();
        const next = (e.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
        const parent = target.parentNode;
        parent.insertBefore(draggedRow, next ? target.nextSibling : target);
      }
    }

    function onSeriesDrop(e) {
      e.preventDefault();
      if (draggedRow) {
        draggedRow.classList.remove('opacity-40');
        draggedRow = null;
      }
    }

    function moveSeriesRow(bookId, direction) {
      const row = document.getElementById(`series-row-${bookId}`);
      if (!row) return;
      if (direction === -1 && row.previousElementSibling) {
        row.parentNode.insertBefore(row, row.previousElementSibling);
      } else if (direction === 1 && row.nextElementSibling) {
        row.parentNode.insertBefore(row.nextElementSibling, row);
      }
    }

    function moveSeriesRowToEdge(bookId, edge) {
      const row = document.getElementById(`series-row-${bookId}`);
      if (!row) return;
      const parent = row.parentNode;
      if (edge === 'top') {
        parent.insertBefore(row, parent.firstChild);
      } else if (edge === 'bottom') {
        parent.appendChild(row);
      }
    }

    function seriesAutoRenumber() {
      const list = document.getElementById('series-books-list');
      if (!list) return;
      const rows = list.querySelectorAll('.series-item');
      rows.forEach((row, idx) => {
        const input = row.querySelector('.series-idx-input');
        if (input) {
          input.value = idx + 1;
          input.classList.add('ring-2', 'ring-indigo-500');
          setTimeout(() => input.classList.remove('ring-2', 'ring-indigo-500'), 600);
        }
      });
    }

    function seriesSortByTitle() {
      const list = document.getElementById('series-books-list');
      if (!list) return;
      const rows = Array.from(list.querySelectorAll('.series-item'));
      rows.sort((a, b) => {
        const tA = (a.dataset.title || '').trim();
        const tB = (b.dataset.title || '').trim();
        return tA.localeCompare(tB);
      });
      rows.forEach(r => list.appendChild(r));
    }

    function seriesSortByDate() {
      const list = document.getElementById('series-books-list');
      if (!list) return;
      const rows = Array.from(list.querySelectorAll('.series-item'));
      rows.sort((a, b) => {
        const dA = (a.dataset.date || '9999-99-99');
        const dB = (b.dataset.date || '9999-99-99');
        return dA.localeCompare(dB);
      });
      rows.forEach(r => list.appendChild(r));
    }

    async function saveSeriesOrder(seriesId) {
      const list = document.getElementById('series-books-list');
      if (!list) return;
      const btn = document.getElementById('series-order-save-btn');
      const statusEl = document.getElementById('series-order-status');
      
      const rows = list.querySelectorAll('.series-item');
      const items = [];
      rows.forEach(row => {
        const bid = parseInt(row.dataset.bookId, 10);
        const input = row.querySelector('.series-idx-input');
        const val = input ? parseFloat(input.value) : null;
        items.push({
          book_id: bid,
          series_index: isNaN(val) ? null : val
        });
      });

      if (btn) {
        btn.disabled = true;
        btn.classList.add('opacity-75');
      }

      try {
        const res = await fetch(`/series/${seriesId}/order`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: items })
        });
        const data = await res.json();
        if (data.success) {
          if (statusEl) {
            statusEl.classList.remove('hidden');
            setTimeout(() => statusEl.classList.add('hidden'), 2500);
          }
          // If book modal is currently open, refresh it
          const bookModal = document.getElementById('book-modal');
          if (bookModal) {
            const currentBookId = bookModal.dataset.bookId;
            if (currentBookId && typeof openBookModal === 'function') {
              openBookModal(parseInt(currentBookId, 10));
            }
          }
          // Refresh main book grid if we are currently filtered by this series or browsing
          const filterInput = document.getElementById('input-series-id');
          if (filterInput && parseInt(filterInput.value, 10) === seriesId && typeof triggerSearch === 'function') {
            triggerSearch();
          } else if (typeof htmx !== 'undefined') {
            const grid = document.getElementById('book-grid');
            if (grid) htmx.trigger(grid, 'refresh');
          }
          setTimeout(() => closeSeriesOrderModal(), 800);
        } else {
          alert("Failed to save series order: " + (data.detail || "Unknown error"));
        }
      } catch (err) {
        console.error(err);
        alert("Network error while saving series order");
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.classList.remove('opacity-75');
        }
      }
    }
  </script>
</div>
