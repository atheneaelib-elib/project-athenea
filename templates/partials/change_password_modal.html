<div id="password-modal" class="fixed inset-0 z-50 overflow-y-auto flex items-center justify-center p-4 sm:p-6 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
  
  <!-- Backdrop Click Area -->
  <div class="fixed inset-0" onclick="closePasswordModal()"></div>

  <!-- Modal Dialog Card -->
  <div class="relative bg-slate-900 border border-slate-700/80 rounded-2xl shadow-2xl max-w-md w-full overflow-hidden z-10 flex flex-col">
    
    <!-- Header -->
    <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/50 flex-shrink-0">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center text-white shadow-md shadow-indigo-600/30">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
        </div>
        <div>
          <h2 class="text-base font-bold text-white">{{ t('profile.modal_title') }}</h2>
          <p class="text-[11px] text-slate-400">{{ t('profile.signed_in_as') }} <span class="text-indigo-400 font-semibold">{{ current_user.username }}</span></p>
        </div>
      </div>
      <button 
        type="button" 
        onclick="closePasswordModal()" 
        class="w-7 h-7 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition-colors cursor-pointer"
        title="{{ t('general.close') }} (Esc)"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <!-- Tab Buttons -->
    <div class="flex border-b border-slate-800 bg-slate-950/30 px-6 pt-3 gap-2">
      <button 
        type="button" 
        id="profile-tab-btn-delivery"
        onclick="switchProfileTab('delivery')"
        class="pb-2.5 px-3 text-xs font-bold border-b-2 border-indigo-500 text-indigo-400 transition-all cursor-pointer flex items-center gap-1.5"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
        <span>{{ t('profile.tab_delivery') }}</span>
      </button>
      <button 
        type="button" 
        id="profile-tab-btn-security"
        onclick="switchProfileTab('security')"
        class="pb-2.5 px-3 text-xs font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all cursor-pointer flex items-center gap-1.5"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        <span>{{ t('profile.tab_security') }}</span>
      </button>
    </div>

    <!-- Feedback Container for HTMX -->
    <div id="password-modal-feedback" class="px-6 pt-4 empty:hidden"></div>

    <!-- TAB 1: Delivery & Email Form -->
    <form 
      id="profile-delivery-form"
      hx-post="/profile/update" 
      hx-target="#password-modal-feedback" 
      hx-swap="innerHTML"
      class="p-6 space-y-4"
    >
      <div>
        <label for="profile_email" class="block text-xs font-semibold text-slate-300 mb-1.5">{{ t('profile.email_label') }}</label>
        <input 
          type="email" 
          id="profile_email" 
          name="email" 
          value="{{ current_user.email or '' }}"
          placeholder="your-email@example.com"
          class="w-full bg-slate-800 text-sm text-white placeholder-slate-500 rounded-xl px-4 py-2.5 border border-slate-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 focus:outline-none transition-all"
        />
        <p class="text-[11px] text-slate-400 mt-1">{{ t('profile.email_help') }}</p>
      </div>

      <div>
        <label for="profile_kindle_email" class="block text-xs font-semibold text-slate-300 mb-1.5 flex items-center justify-between">
          <span>{{ t('profile.kindle_email_label') }}</span>
          <span class="text-[10px] text-indigo-400 font-normal">{{ t('profile.kindle_auto_fill') }}</span>
        </label>
        <input 
          type="email" 
          id="profile_kindle_email" 
          name="kindle_email" 
          value="{{ current_user.kindle_email or '' }}"
          placeholder="username@kindle.com"
          class="w-full bg-slate-800 text-sm text-white placeholder-slate-500 rounded-xl px-4 py-2.5 border border-slate-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 focus:outline-none transition-all"
        />
        <p class="text-[11px] text-slate-400 mt-1">
          {{ t('profile.kindle_email_help') }}
        </p>
      </div>

      <div class="pt-3 flex items-center justify-end gap-2.5">
        <button 
          type="button" 
          onclick="closePasswordModal()" 
          class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 border border-slate-700 transition-colors cursor-pointer"
        >
          {{ t('general.cancel') }}
        </button>
        <button 
          type="submit" 
          class="px-5 py-2 rounded-xl text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-500 shadow-lg shadow-indigo-600/30 transition-all cursor-pointer flex items-center gap-1.5"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
          {{ t('profile.save_delivery_btn') }}
        </button>
      </div>
    </form>

    <!-- TAB 2: Change Password Form -->
    <form 
      id="change-password-form"
      hx-post="/profile/change-password" 
      hx-target="#password-modal-feedback" 
      hx-swap="innerHTML"
      class="p-6 space-y-4 hidden"
    >
      <!-- Current Password -->
      <div>
        <label for="current_password" class="block text-xs font-semibold text-slate-300 mb-1.5">{{ t('profile.current_password') }}</label>
        <div class="relative">
          <input 
            type="password" 
            id="current_password" 
            name="current_password" 
            required 
            autocomplete="current-password"
            placeholder="{{ t('profile.current_password_placeholder') }}"
            class="w-full bg-slate-800 text-sm text-white placeholder-slate-500 rounded-xl px-4 py-2.5 pr-10 border border-slate-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 focus:outline-none transition-all"
          />
          <button 
            type="button" 
            onclick="togglePasswordVisibility('current_password')"
            class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-200 cursor-pointer"
            tabindex="-1"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
          </button>
        </div>
      </div>

      <!-- New Password -->
      <div>
        <label for="new_password" class="block text-xs font-semibold text-slate-300 mb-1.5">{{ t('profile.new_password') }}</label>
        <div class="relative">
          <input 
            type="password" 
            id="new_password" 
            name="new_password" 
            required 
            minlength="6"
            autocomplete="new-password"
            placeholder="{{ t('profile.new_password_placeholder') }}"
            class="w-full bg-slate-800 text-sm text-white placeholder-slate-500 rounded-xl px-4 py-2.5 pr-10 border border-slate-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 focus:outline-none transition-all"
          />
          <button 
            type="button" 
            onclick="togglePasswordVisibility('new_password')"
            class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-200 cursor-pointer"
            tabindex="-1"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
          </button>
        </div>
      </div>

      <!-- Confirm New Password -->
      <div>
        <label for="confirm_password" class="block text-xs font-semibold text-slate-300 mb-1.5">{{ t('profile.confirm_password') }}</label>
        <div class="relative">
          <input 
            type="password" 
            id="confirm_password" 
            name="confirm_password" 
            required 
            minlength="6"
            autocomplete="new-password"
            placeholder="{{ t('profile.confirm_password_placeholder') }}"
            class="w-full bg-slate-800 text-sm text-white placeholder-slate-500 rounded-xl px-4 py-2.5 pr-10 border border-slate-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 focus:outline-none transition-all"
          />
          <button 
            type="button" 
            onclick="togglePasswordVisibility('confirm_password')"
            class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-200 cursor-pointer"
            tabindex="-1"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
          </button>
        </div>
      </div>

      <!-- Actions -->
      <div class="pt-3 flex items-center justify-end gap-2.5">
        <button 
          type="button" 
          onclick="closePasswordModal()" 
          class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 border border-slate-700 transition-colors cursor-pointer"
        >
          {{ t('general.cancel') }}
        </button>
        <button 
          type="submit" 
          id="submit-password-btn"
          class="px-5 py-2 rounded-xl text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-500 shadow-lg shadow-indigo-600/30 transition-all cursor-pointer flex items-center gap-1.5"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
          {{ t('profile.update_password_btn') }}
        </button>
      </div>
    </form>
  </div>
</div>

<script>
function closePasswordModal() {
  const modal = document.getElementById('password-modal');
  if (modal) modal.remove();
}

function switchProfileTab(tab) {
  const deliveryForm = document.getElementById('profile-delivery-form');
  const securityForm = document.getElementById('change-password-form');
  const deliveryBtn = document.getElementById('profile-tab-btn-delivery');
  const securityBtn = document.getElementById('profile-tab-btn-security');
  const feedback = document.getElementById('password-modal-feedback');
  if (feedback) feedback.innerHTML = '';

  if (tab === 'delivery') {
    deliveryForm.classList.remove('hidden');
    securityForm.classList.add('hidden');
    deliveryBtn.className = 'pb-2.5 px-3 text-xs font-bold border-b-2 border-indigo-500 text-indigo-400 transition-all cursor-pointer flex items-center gap-1.5';
    securityBtn.className = 'pb-2.5 px-3 text-xs font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all cursor-pointer flex items-center gap-1.5';
  } else {
    deliveryForm.classList.add('hidden');
    securityForm.classList.remove('hidden');
    securityBtn.className = 'pb-2.5 px-3 text-xs font-bold border-b-2 border-indigo-500 text-indigo-400 transition-all cursor-pointer flex items-center gap-1.5';
    deliveryBtn.className = 'pb-2.5 px-3 text-xs font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all cursor-pointer flex items-center gap-1.5';
  }
}

function togglePasswordVisibility(fieldId) {
  const input = document.getElementById(fieldId);
  if (input) {
    input.type = input.type === 'password' ? 'text' : 'password';
  }
}
</script>
