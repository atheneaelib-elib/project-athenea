<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Indigo/Violet Primary Glow -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Gold Accent / Athena's Wisdom -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Luminous Book Pages -->
    <linearGradient id="pageGradLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="pageGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0.75" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="auraGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Ambient Wisdom Aura -->
  <circle cx="256" cy="240" r="140" fill="#6366f1" opacity="0.25" filter="url(#auraGlow)" />
  <circle cx="256" cy="210" r="70" fill="#fbbf24" opacity="0.2" filter="url(#auraGlow)" />

  <!-- Athena's Crown / Olive Laurel Arch -->
  <path d="M 200 130 C 220 115 240 110 256 110 C 272 110 292 115 312 130" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.9" />
  <!-- Central Wisdom Star -->
  <polygon points="256,92 260,104 272,106 263,114 266,126 256,119 246,126 249,114 240,106 252,104" fill="url(#goldGrad)" filter="url(#softGlow)" />

  <!-- The Owl of Athena Head / Face Silhouette -->
  <!-- Forehead crest -->
  <path d="M 210 148 Q 256 175 302 148 L 292 185 Q 256 195 220 185 Z" fill="url(#primaryGrad)" />
  
  <!-- Outer Brow & Mask -->
  <path d="M 180 180 C 210 160 250 175 256 205 C 262 175 302 160 332 180 C 342 205 330 240 300 255 C 275 268 260 255 256 250 C 252 255 237 268 212 255 C 182 240 170 205 180 180 Z" 
        fill="#1e1b4b" stroke="url(#primaryGrad)" stroke-width="4" />

  <!-- Left Owl Eye (Wisdom Orb) -->
  <circle cx="222" cy="216" r="30" fill="#090d16" stroke="url(#goldGrad)" stroke-width="4.5" />
  <circle cx="222" cy="216" r="20" fill="url(#goldGrad)" />
  <circle cx="222" cy="216" r="11" fill="#0f172a" />
  <circle cx="226" cy="212" r="4.5" fill="#ffffff" />

  <!-- Right Owl Eye (Wisdom Orb) -->
  <circle cx="290" cy="216" r="30" fill="#090d16" stroke="url(#goldGrad)" stroke-width="4.5" />
  <circle cx="290" cy="216" r="20" fill="url(#goldGrad)" />
  <circle cx="290" cy="216" r="11" fill="#0f172a" />
  <circle cx="294" cy="212" r="4.5" fill="#ffffff" />

  <!-- Golden Beak -->
  <polygon points="256,224 264,248 256,262 248,248" fill="url(#goldGrad)" filter="url(#softGlow)" />

  <!-- Open Codex / Wings of Literature & Knowledge -->
  <!-- Left Wing / Open Book Left Pages -->
  <g id="leftBookWing">
    <!-- Outer page wing -->
    <path d="M 252 270 C 210 270 140 285 96 325 C 90 331 96 342 105 340 C 145 330 205 315 252 305 Z" fill="url(#primaryGrad)" opacity="0.85" />
    <!-- Middle page wing -->
    <path d="M 252 292 C 205 292 140 310 98 355 C 93 361 100 372 108 370 C 148 358 206 342 252 332 Z" fill="url(#pageGradLeft)" opacity="0.9" />
    <!-- Main open page -->
    <path d="M 252 315 C 200 315 136 335 102 385 C 98 392 105 402 114 400 C 158 388 214 372 252 360 Z" fill="url(#pageGradLeft)" />
    <!-- Lower wing feather/page accent -->
    <path d="M 252 342 C 210 345 155 368 124 415 C 120 422 128 430 136 427 C 172 414 218 398 252 388 Z" fill="url(#goldGrad)" opacity="0.9" />
  </g>

  <!-- Right Wing / Open Book Right Pages -->
  <g id="rightBookWing">
    <!-- Outer page wing -->
    <path d="M 260 270 C 302 270 372 285 416 325 C 422 331 416 342 407 340 C 367 330 307 315 260 305 Z" fill="url(#primaryGrad)" opacity="0.85" />
    <!-- Middle page wing -->
    <path d="M 260 292 C 307 292 372 310 414 355 C 419 361 412 372 404 370 C 364 358 306 342 260 332 Z" fill="url(#pageGradRight)" opacity="0.9" />
    <!-- Main open page -->
    <path d="M 260 315 C 312 315 376 335 410 385 C 414 392 407 402 398 400 C 354 388 298 372 260 360 Z" fill="url(#pageGradRight)" />
    <!-- Lower wing feather/page accent -->
    <path d="M 260 342 C 302 345 357 368 388 415 C 392 422 384 430 376 427 C 340 414 294 398 260 388 Z" fill="url(#goldGrad)" opacity="0.9" />
  </g>

  <!-- Book Spine Center Binding -->
  <path d="M 253 268 L 259 268 L 258 410 L 254 410 Z" fill="url(#goldGrad)" />
  <circle cx="256" cy="416" r="6" fill="url(#goldGrad)" filter="url(#softGlow)" />
</svg>
