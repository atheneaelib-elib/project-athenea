<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="10%" style="stop-color:#ffffff;stop-opacity:0.0" />
      <stop offset="90%" style="stop-color:#000000;stop-opacity:0.0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.35" />
    </linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#grad)" rx="8" />
  <!-- Spine overlay -->
  <rect width="300" height="450" fill="url(#spine)" rx="8" />
  <!-- Book border accent -->
  <rect x="15" y="15" width="270" height="420" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" rx="4" />
  <!-- Center Book Icon -->
  <g transform="translate(110, 170)" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z" transform="scale(3.5)" />
    <path d="M6 6h10M6 10h10" transform="scale(3.5)" stroke-width="2" />
  </g>
  <!-- Text -->
  <text x="150" y="320" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="1">NO COVER</text>
  <text x="150" y="342" text-anchor="middle" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">eBook Library</text>
</svg>
